name: Deploy Portfolio to AWS S3 & CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  deploy:
    name: Sync to S3 & Invalidate CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy Media & Documents to S3 (Immutable Long-Term Cache)
        run: |
          echo "--> Uploading static media assets (assets/*) with 1-year cache..."
          aws s3 sync . s3://${{ secrets.S3_BUCKET_NAME }} \
            --exclude "*" \
            --include "assets/*" \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Deploy Code Assets (CSS/JS) to S3 (Fast Revalidation)
        run: |
          echo "--> Uploading CSS & JS code assets with must-revalidate..."
          aws s3 sync . s3://${{ secrets.S3_BUCKET_NAME }} \
            --exclude "*" \
            --include "css/*" \
            --include "js/*" \
            --cache-control "public, max-age=0, must-revalidate" \
            --delete

      - name: Deploy HTML & Root Files to S3 (Immediate Revalidation)
        run: |
          echo "--> Uploading index.html and root files with zero-cache revalidation..."
          aws s3 sync . s3://${{ secrets.S3_BUCKET_NAME }} \
            --exclude "*" \
            --include "*.html" \
            --include "robots.txt" \
            --include "sitemap.xml" \
            --include "favicon.ico" \
            --include "site.webmanifest" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront Cache
        run: |
          echo "--> Creating CloudFront invalidation for /* on distribution: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)
          echo "Invalidation created successfully with ID: $INVALIDATION_ID"

      - name: Deployment Success Summary
        run: |
          echo "=========================================================="
          echo "✔ Successfully deployed Portfolio to S3: ${{ secrets.S3_BUCKET_NAME }}"
          echo "✔ CloudFront cache invalidated for distribution: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          echo "✔ Live URL: https://faisal.host"
          echo "=========================================================="

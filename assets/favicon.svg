<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="chevronGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle with Glowing Tech Border -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="2.5"/>

  <!-- Subtle grid accent lines for high-tech aesthetic -->
  <line x1="2" y1="20" x2="62" y2="20" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.15"/>
  <line x1="2" y1="44" x2="62" y2="44" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.15"/>
  <line x1="20" y1="2" x2="20" y2="62" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.15"/>
  <line x1="44" y1="2" x2="44" y2="62" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- High-contrast Terminal Prompt Symbol: '>' -->
  <path d="M16 21 L30 32 L16 43" fill="none" stroke="url(#chevronGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- High-contrast Cursor Underscore: '_' -->
  <line x1="36" y1="43" x2="49" y2="43" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>

  <!-- Live Status Pulse Indicator in Top-Right Corner -->
  <circle cx="49" cy="15" r="4.5" fill="#10b981" filter="url(#glow)"/>
  <circle cx="49" cy="15" r="7" fill="none" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.5"/>
</svg>
